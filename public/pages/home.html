        <!-- Hero Section -->
        <section id="homeHero" class="mb-4">

            <div class="carousel-frame">

                    <!-- TBC Add name grabbed from login/sign in -->
                <h1>Hello Name</h1>
                </div>

                <!-- TBC Carousel get from API -->

                <img src="https://raw.githubusercontent.com/asbelljc/carousel-builder/main/sample/Images/animal.jpg" />

<!-- Trending Movies - Bootstrap carousel (filled by script.js) -->
        <section id="homeInfoCardSection" class="mb-4">
 
            <div class="listHeading">
                <h3>Trending Movies</h3>
            </div>
 
            <div class="container-fluid">
                <div id="trendingCarousel" class="carousel slide" data-bs-ride="carousel" data-bs-interval="6000" data-bs-touch="true">
                    <div class="carousel-inner">
                        <div class="carousel-item active">
                            <p class="loading-text text-center py-5">Loading trending movies…</p>
                        </div>
                    </div>
 
                    <button class="carousel-control-prev" type="button" data-bs-target="#trendingCarousel" data-bs-slide="prev">
                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Previous</span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#trendingCarousel" data-bs-slide="next">
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Next</span>
                    </button>
                </div>
            </div>
 
        </section>
 
 
        <!-- Top Rated Movies - grid (filled by script.js) -->
        <section class="HeadingWithCards mb-4">
 
            <div class="listHeading">
                <h3>Top Rated Movies</h3>
            </div>
 
            <div class="container-fluid">
                <div id="topRatedGrid" class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-xl-6 g-3 mt-1">
                    <p class="loading-text text-center py-5 w-100">Loading top rated movies…</p>
                </div>
 
                <div class="text-center mt-4">
                    <button id="showMoreTopRated" type="button" class="btn showMoreBtn btn-outline-primary">Show more</button>
                </div>
            </div>
 
        </section>
