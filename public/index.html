<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE-edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="keywords" content="html, css, Javascript, movie, watch later, watch list" />
        <meta
            name="author"
            content="co-authored by Adel van der Walt 262001, Andrya Kritzinger 262002, Hantie Pistorius 262029, Kiara Addinall 262078" />

        <title>Popcorn Movies - Log In</title>

        <!-- bootstap link -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous" />

        <link rel="stylesheet" href="css/main.css" />
    </head>
    <body>
        <div id="logInCard">
                <main class="info-box auth-card">
                    <h4 id="form-welcome">Welcome back!</h4>
                    <h1 id="form-title">Sign In</h1>

                    <form id="auth-form">
                        <label for="email-input">Email</label>
                        <input type="email" id="email-input" placeholder="you@example.com" required />

                        <label for="password-input">Password</label>
                        <input type="password" id="password-input" placeholder="At least 6 characters" required />

                        <button type="submit" id="submit-button">Log In</button>
                    </form>

                    <!-- Error and success messages appear in here -->
                    <p id="message-text"></p>

                    <div class="formBottom">
                        <p class="switch-row">
                            <span id="switch-text">Don't have an account?</span>
                            <a href="#" id="switch-link">Sign up</a>
                        </p>
                        <div id="signFormLogo"><img src="assets/img/logo.png" /></div>
                    </div>
                </main>

            </div>
        </div>

        <script type="module" src="js/firebaseJS.js"></script>

        <!-- Javascript Linking -->
        <script defer src="../js/script.js"></script>

        <!-- jQuery, from a CDN -->
        <script
            src="https://code.jquery.com/jquery-4.0.0.js"
            integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U="
            crossorigin="anonymous"></script>

        <!-- bootstrap link -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>

    </body>
</html>
