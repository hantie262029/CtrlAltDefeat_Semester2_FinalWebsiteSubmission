<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE-edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="keywords" content="html, css, Javascript, movie, watch later, watch list" />
        <meta
            name="author"
            content="co-authored by Adel van der Walt 262001, Andrya Kritzinger 262002, Hantie Pistorius 262029, Kiara Addinall 262078" />

        <title>Popcorn Movies</title>

        <!-- bootstap link -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

        <link rel="stylesheet" href="css/main.css" />
    </head>
    <body>

        <!-- sign in/up -->
         <section>
            
            <div id="cursor"></div> 
            <div id="phone">
            
            <!-- status bar -->
            <div id="statusbar">
                <div class="clock"><div class="hours"></div><div class="minutes"></div><div class="twelvehr"></div></div>
                <div id="icons">
            <svg version="1.1" x="0px" y="0px" width="51.8px" height="14px" viewBox="0 0 51.8 14" style="enable-background:new 0 0 51.8 14;" xml:space="preserve">
            <g><g class="st0"><path class="st1" d="M8.8,14l8.8-10.9C17.3,2.8,13.9,0,8.8,0S0.3,2.8,0,3.1L8.8,14L8.8,14L8.8,14L8.8,14L8.8,14z"/></g></g>
            <g><polygon class="st1" points="19.8,14 33.8,14 33.8,0 	"/></g>
            <g><path class="st1" d="M48.8,1V0h-3v1h-3v13h9V1H48.8z"/></g></svg>
            </div>
                </div>  
            <!-- End status bar -->
                
            <div id="content-wrapper">
            
                <div class="card" id="login">
                
                <form>
                <h1>Sign in</h1>
            
                    <div class="input">
                    <input id="email" type="email" class="validate">
                    <label for="email">Username or Email</label>
                    </div>
                        
                    <div class="input">
                    <input id="password" type="password" class="validate">
                    <label for="password">Password</label>
                    </div>
                
                <span class="checkbox remember">
                <input type="checkbox" id="remember" />
                <label for="remember">Remember me</label>
                </span>
                    
                <span class="checkbox forgot">
                <a href="#">Forgot Password?</a>
                </span>
                
                <button disabled>Login</button>
                <!-- Temp bypass link to home page TBC Remove later -->
                <a href="/public/pages/home.html">Temp Bypass Go to home page</a>
                </form>
                <a href="javascript:void(0)" class="account-check">Already an account? <b>Sign in</b></a>
            </div>
                
            
                
                <div class="card hidden" id="register">
                
                <form>
                <h1>Sign up</h1>
            
                    <div class="input">
                    <input id="email" type="email" class="validate">
                    <label for="email">Email</label>
                    </div>
                        
                    <div class="input">
                    <input id="password" type="password" class="validate">
                    <label for="password">Password</label>
                    </div>
                    
                            <div class="input">
                    <input id="confirm-password" type="password" class="validate">
                    <label for="confirm-password">Confirm Password</label>
                    </div>
                
                <span class="checkbox remember">
                <input type="checkbox" id="terms" />
                <label for="terms">I have read <b>Terms and Conditions</b></label>
                </span>
                
                
                <button disabled>Register</button>
                </form>
                <a href="javascript:void(0)" id="gotologin" class="account-check">Don't have an account? <b>Sign up</b></a>
                </div>
            
            
            
            </div>
            </div>

         </section>


        <!-- bootstrap link -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <!-- Javascript Linking -->
        <script defer src="js/script.js"></script>
    </body>
</html>
